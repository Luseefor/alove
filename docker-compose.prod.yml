# Public web host only. The dedicated runner uses docker-compose.runner.yml.
services:
  web:
    image: ${ALOVE_WEB_IMAGE:?Set immutable ALOVE_WEB_IMAGE}
    env_file:
      - path: .deploy/web.env
        format: raw
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_LOCAL_STANDALONE: "false"
      ALOVE_LOCAL_COMPILE_ORIGIN: ""
      ALOVE_COMPILE_TRUST_PROXY: "true"
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2
    # Liveness keeps the website/help reachable during a queue outage.
    # The release gate separately checks /api/ready, including Redis and worker.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ALOVE_SITE_URL: ${ALOVE_SITE_URL:?Set HTTPS ALOVE_SITE_URL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
    name: alove_caddy_data
  caddy_config:
    name: alove_caddy_config
