#cloud-config
# Ubuntu 24.04, amd64. Use this on two separate hosts.
# Supply your public SSH key through the VM provider's account configuration.
# The deployment account can control Docker: treat its key as host-root access.
users:
  - default
  - name: alove
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: []
package_update: true
packages: [ca-certificates, curl]
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker alove
  - install -d -m 0700 -o alove -g alove /opt/alove /opt/alove/releases
  - install -d -m 0755 /var/lib/alove/jobs
