name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      ALOVE_SITE_URL: ${{ vars.ALOVE_SITE_URL }}
      NEXT_PUBLIC_LOCAL_STANDALONE: "false"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ vars.CLERK_JWT_ISSUER_DOMAIN }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DEPLOY_WEB_HOST: ${{ vars.DEPLOY_WEB_HOST }}
      DEPLOY_RUNNER_HOST: ${{ vars.DEPLOY_RUNNER_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      COMPILE_USE_DOCKER: "true"
      COMPILE_WORK_ROOT: /var/lib/alove/jobs
      WORKER_CONCURRENCY: "1"
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main || { echo "Deploy runs from main only"; exit 1; }
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.3.10}
      - name: Require successful CI for this main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | length' > /tmp/ci-count
          test "$(cat /tmp/ci-count)" -ge 1
      - run: bun install --frozen-lockfile
      - name: Check application and backend credentials
        run: |
          bun scripts/deploy/checkConfig.ts --target=web
          bun scripts/deploy/checkConfig.ts --target=backend
          bun scripts/deploy/checkConfig.ts --target=transport
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry prefix
        id: registry
        run: echo "prefix=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build web with production public configuration
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_LOCAL_STANDALONE=false
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CONVEX_URL=${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      - name: Build runner
        id: runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/compile-worker/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-runner:${{ github.sha }}
      - name: Build TeX image
        id: tex
        uses: docker/build-push-action@v6
        with:
          context: services/tex-runner
          file: services/tex-runner/Dockerfile.local
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-tex:${{ github.sha }}
      - name: Deploy backend authentication configuration and functions
        working-directory: apps/web
        run: |
          bunx convex env set CLERK_JWT_ISSUER_DOMAIN "$CLERK_JWT_ISSUER_DOMAIN"
          bunx convex env set CLERK_WEBHOOK_SECRET "$CLERK_WEBHOOK_SECRET"
          bunx convex deploy --yes --cmd-url-env-var-name CONVEX_DEPLOYED_URL --cmd 'test "$CONVEX_DEPLOYED_URL" = "$NEXT_PUBLIC_CONVEX_URL"'
      - name: Activate immutable images on separate hosts
        env:
          ALOVE_WEB_IMAGE: ${{ steps.registry.outputs.prefix }}-web@${{ steps.web.outputs.digest }}
          ALOVE_RUNNER_IMAGE: ${{ steps.registry.outputs.prefix }}-runner@${{ steps.runner.outputs.digest }}
          COMPILE_DOCKER_IMAGE: ${{ steps.registry.outputs.prefix }}-tex@${{ steps.tex.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: bun scripts/deploy/deploy.ts
